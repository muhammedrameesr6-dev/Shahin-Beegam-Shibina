<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="cardBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#240408" />
      <stop offset="100%" stop-color="#070002" />
    </radialGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8393A" stop-opacity="0" />
      <stop offset="50%" stop-color="#C8393A" stop-opacity="1" />
      <stop offset="100%" stop-color="#C8393A" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#cardBg)" />

  <!-- Borders -->
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#C8393A" stroke-width="1.2" stroke-opacity="0.5" />
  <rect x="34" y="34" width="1132" height="562" fill="none" stroke="#C8393A" stroke-width="1" stroke-opacity="0.25" />

  <!-- Corner Flourishes -->
  <path d="M44 64 L44 44 L64 44" fill="none" stroke="#C8393A" stroke-width="1.5" />
  <path d="M1156 64 L1156 44 L1136 44" fill="none" stroke="#C8393A" stroke-width="1.5" />
  <path d="M44 566 L44 586 L64 586" fill="none" stroke="#C8393A" stroke-width="1.5" />
  <path d="M1156 566 L1156 586 L1136 586" fill="none" stroke="#C8393A" stroke-width="1.5" />

  <!-- Left Content: Texts -->
  <!-- Bismillah -->
  <text x="350" y="115" text-anchor="middle" fill="#C8393A" font-family="'Amiri', 'Traditional Arabic', serif" font-size="28" font-weight="bold">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</text>

  <!-- Eyebrow -->
  <text x="350" y="155" text-anchor="middle" fill="#C8393A" font-family="'Cinzel', 'Playfair Display', serif" font-size="13" letter-spacing="4" font-weight="600">WEDDING INVITATION</text>

  <!-- Names -->
  <text x="350" y="235" text-anchor="middle" fill="#F5EBE6" font-family="'Alex Brush', 'Great Vibes', cursive, 'Brush Script MT'" font-size="64" filter="url(#glow)">Shahin</text>
  <text x="350" y="280" text-anchor="middle" fill="#C8393A" font-family="'Alex Brush', 'Great Vibes', cursive, 'Brush Script MT'" font-size="44">&amp;</text>
  <text x="350" y="340" text-anchor="middle" fill="#F5EBE6" font-family="'Alex Brush', 'Great Vibes', cursive, 'Brush Script MT'" font-size="64" filter="url(#glow)">Beegam Shibina</text>

  <!-- Divider Line -->
  <line x1="230" y1="375" x2="470" y2="375" stroke="url(#goldLine)" stroke-width="1.5" />

  <!-- Date -->
  <text x="350" y="415" text-anchor="middle" fill="#F5EBE6" font-family="'Playfair Display', 'Cinzel', serif" font-size="19" letter-spacing="3" font-weight="600">THURSDAY · 24 DECEMBER 2026</text>
  <text x="350" y="445" text-anchor="middle" fill="#A8908A" font-family="'Cinzel', serif" font-size="14" font-style="italic">15 Rajab 1448 AH · Kallara, Kerala</text>

  <!-- Venues -->
  <text x="350" y="490" text-anchor="middle" fill="#E6D5D0" font-family="'Cinzel', serif" font-size="13.5" letter-spacing="1">Nikah: Happy Convention Centre (11:30 AM)</text>
  <text x="350" y="515" text-anchor="middle" fill="#E6D5D0" font-family="'Cinzel', serif" font-size="13.5" letter-spacing="1">Reception: AR Mini Hall (03:30 PM)</text>

  <!-- Shijas Mention -->
  <line x1="260" y1="540" x2="440" y2="540" stroke="#C8393A" stroke-width="0.8" stroke-dasharray="3,3" stroke-opacity="0.4" />
  <text x="350" y="565" text-anchor="middle" fill="#C8393A" font-family="'Cinzel', serif" font-size="12" letter-spacing="2">❦ SHARING THE HAPPINESS WITH SHIJAS</text>

  <!-- Right Image Frame -->
  <rect x="710" y="75" width="410" height="480" fill="#0A0204" stroke="#C8393A" stroke-width="1.2" />
  <rect x="716" y="81" width="398" height="468" fill="none" stroke="#F5EBE6" stroke-width="0.6" stroke-opacity="0.2" />

  <!-- Clip path for illustration -->
  <clipPath id="frameClip">
    <rect x="717" y="82" width="396" height="466" />
  </clipPath>
  <image href="rashid.png" x="650" y="70" width="530" height="490" preserveAspectRatio="xMidYMid slice" clip-path="url(#frameClip)" />
</svg>
